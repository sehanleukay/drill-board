    const { error } = await sb.from('teams').update({ show_names: next }).eq('id', state.teamId);
    if(error) return toast('Couldn’t change the setting. Check your connection.');
    state.showNames = coachTeam.show_names = next; renderPlayers(); renderCoachProfile(); toast(next ? 'Names now visible to teammates' : 'Names hidden from teammates'); return;
  }
  if('newchal' in d){ ui.newChal = true; renderBoard(); return; }
  if('cancelchal' in d){ ui.newChal = false; renderBoard(); return; }
  if(d.cmetric){ ui.cMetric = d.cmetric; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if(d.cdays){ ui.cDays = d.cdays; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if(d.delchal){
    if(!confirm('Delete this challenge?')) return;
    const { error } = await sb.from('challenges').delete().eq('id', d.delchal);
    if(error) return toast('Couldn’t delete. Check your connection.');
    state.compete.challenges = state.compete.challenges.filter(c => c.id !== d.delchal); renderBoard(); return;
  }
  if(d.meidx){ ui.meIdx = +d.meidx; renderHeader(); renderPlayerView(); return; }
  if(d.medrill){ ui.meDrill = d.medrill; renderPlayerView(); return; }
  if(d.meperiod){ ui.mePeriod = d.meperiod; renderPlayerView(); return; }
  // coach
  if(d.tab){ showTab(d.tab); return; }
  if('celenext' in d){ nextCele(); return; }
  if(d.photo){ photoSheet(d.photo); return; }
  if(d.upphoto){ uploadAvatar(d.upphoto); return; }
  if(d.rmphoto){ removeAvatar(d.rmphoto); return; }
  if(d.rmplayerphoto){ if(confirm('Remove this player’s profile photo?')) removeAvatar('coach', d.rmplayerphoto); return; }
  if('allowphotos' in d){
    const next = coachTeam.allow_photos === false;
    const { error } = await sb.from('teams').update({ allow_photos: next }).eq('id', state.teamId);
    if(error) return toast('Couldn’t change the setting. Check your connection.');
    coachTeam.allow_photos = next; await loadTeamAvatars(state.teamId); renderCoachProfile(); renderPlayers(); toast(next ? 'Player photos on' : 'Player photos off and hidden'); return;
  }
  if(d.jump){ document.getElementById(d.jump)?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if(d.lockinfo){ toast(`${BADGES[d.lockinfo].name}: ${BADGES[d.lockinfo].desc}`); return; }
  if('editprof' in d){ ui.editProf = !ui.editProf; renderPlayerView(); return; }
  if(d.plistgo){ ui.plist = d.plistgo; renderPeople(myPlayers[ui.meIdx].id); $('#peopleBox')?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if(d.plist){ ui.plist = d.plist; renderPeople(myPlayers[ui.meIdx].id); return; }
  if(d.freq){ followAction('req', d.freq); return; }
  if(d.facc){ followAction('acc', d.facc); return; }
  if(d.fdec){ followAction('dec', d.fdec); return; }
  if(d.funf){ followAction('unf', d.funf); return; }
  if(d.frem){ followAction('rem', d.frem); return; }
  if(d.fblock){ if(confirm('Block this player? They’ll be removed and can’t ask to follow you again.')) followAction('block', d.fblock); return; }
  if(d.cfrem){ const [pl, fo] = d.cfrem.split('|'); if(!confirm('Remove this follower and block them from following this player again?')) return;
    const { error } = await sb.rpc('remove_follower', { p_player: pl, p_follower: fo, p_block: true });
    if(error) return toast('Couldn’t update. Check your connection.'); toast('Follower removed'); loadCoachFollowers(pl); return; }
  if('previewpick' in d){ ui.menu = false; $('#menu').hidden = true; openPreviewPicker(); return; }
  if(d.previewas){ startPreview(d.previewas); return; }
  if('exitpreview' in d){ exitPreview(); return; }
  if(d.lbscope){ ui.lbScope = d.lbscope; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); loadBoards(mode === 'coach' ? coachTeam : pdata.teams[myPlayers[ui.meIdx].team_id]); return; }
  if(d.lbmetric){ ui.lbMetric = d.lbmetric; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); loadBoards(mode === 'coach' ? coachTeam : pdata.teams[myPlayers[ui.meIdx].team_id]); return; }
  if(d.react){ react(mode === 'coach' ? state.teamId : myPlayers[ui.meIdx].team_id, d.react, d.emoji, b); return; }
  if('togpub' in d || 'togteampub' in d){ b.setAttribute('aria-checked', b.getAttribute('aria-checked') !== 'true'); return; }
  if(d.clearnick){
    if(!confirm('Remove this nickname? The player will be taken off public leaderboards until they choose a new one.')) return;
    const { error } = await sb.from('players').update({ nickname: null, public_opt_in: false }).eq('id', d.clearnick);
    if(error) return toast('Couldn’t update. Check your connection.');
    Object.assign(player(d.clearnick), { nickname: null, public_opt_in: false }); renderPlayers(); toast('Nickname removed'); return;
  }
  if('closesheet' in d){ $('#sheet').hidden = true; $('#sheet').innerHTML = ''; return; }
  if('doshare' in d){ try{ await navigator.share({ files:[shareFile], text:'My shooting on Drill Board' }); }catch(_){} return; }
  if(d.sharebadge){
    const p = myPlayers[ui.meIdx];
    $('#celebrate').hidden = true; celeQ = [];
    openShare({ type:'badge', key:d.sharebadge, kicker: `${p.name} earned` }); return;
  }
  if('sharestats' in d){
    const p = myPlayers[ui.meIdx], C = pdata.compete[p.team_id] || { board:[], badges:[] };
    const res = pdata.results.filter(x => x.pid === p.id), m = res.reduce((s,x)=>s+x.m,0), a = res.reduce((s,x)=>s+x.a,0);
    const meRow = C.board.find(r => r.player_id === p.id) || { xp:0, badges:0 }, st = dayStreak(res.map(x => x.date));
    openShare({ type:'stats', name: p.name + (p.num ? `  #${p.num}` : ''), team: pdata.teams[p.team_id]?.name || '', big: pct(m,a),
      sub: `${m.toLocaleString()} of ${a.toLocaleString()} shots made`, pills: [[`Lv ${levelInfo(meRow.xp).lv}`, 'Level'], [String(st.cur), 'Day streak'], [String(meRow.badges), 'Badges']] });
    return;
  }
  if(d.spick){ ui.soloDrill = d.spick; renderPlayerView(); return; }
  if('sstart' in d){ const p = myPlayers[ui.meIdx]; saveSolo(p.id, { drill: ui.soloDrill, started: Date.now(), log: [] }); renderPlayerView(); return; }
  if(d.sshot){ const p = myPlayers[ui.meIdx], so = loadSolo(p.id); if(!so) return; so.log.push(d.sshot === '1' ? 1 : 0); saveSolo(p.id, so); haptic(); renderPlayerView();
    const pad = $('#soloPad'); if(pad) pad.classList.add(d.sshot === '1' ? 'bump-make' : 'bump-miss'); return; }
  if('sundo' in d){ const p = myPlayers[ui.meIdx], so = loadSolo(p.id); if(so){ so.log.pop(); saveSolo(p.id, so); } renderPlayerView(); return; }
  if('scancel' in d){ if(confirm('Discard this practice? Shots logged so far will be lost.')){ saveSolo(myPlayers[ui.meIdx].id, null); renderPlayerView(); } return; }
  if('sfinish' in d){
    if(ui.busy) return;
    const p = myPlayers[ui.meIdx], so = loadSolo(p.id); if(!so || !so.log.length) return;
    let best = 0, r = 0; so.log.forEach(x => { r = x ? r + 1 : 0; best = Math.max(best, r); });
    const before = dayStreak(pdata.results.filter(x => x.pid === p.id).map(x => x.date)).cur;
    ui.busy = true; renderPlayerView();
    const { error } = await sb.rpc('log_solo', { p_player: p.id, p_drill: so.drill, p_made: so.log.filter(x => x).length, p_attempts: so.log.length, p_best_streak: best, p_started: new Date(so.started).toISOString() });
    ui.busy = false;
    if(error){ renderPlayerView(); return toast(/practice|shots|Makes|Pick|tomorrow/i.test(error.message) ? error.message : 'Couldn’t save. Your shots are kept on this phone. Try again.'); }
    saveSolo(p.id, null); ui.ptab = 'me'; clearCaches();
    await loadPlayer();
    const after = dayStreak(pdata.results.filter(x => x.pid === p.id).map(x => x.date)).cur;
    toast(after > before && after >= 2 ? `Practice saved. ${after}-day streak!` : 'Practice saved');
    return;
  }
  if(d.sdel){
    if(!confirm('Delete this practice session?')) return;
    const { error } = await sb.rpc('delete_solo', { p_session: d.sdel });
    if(error) return toast('Couldn’t delete. Check your connection.');
    pdata.results = pdata.results.filter(x => x.sid !== d.sdel); renderPlayerView(); return;
  }

  if(d.go){ showTab(d.go); $('#pName')?.focus(); return; }
  if('import' in d){ importLocal(b); return; }
  if(d.pick){ ui.drill = d.pick; renderDrill(); return; }
  if('adddrill' in d){
    const n = (prompt('Drill name, e.g. Corner 3s') || '').trim().slice(0,60);
    if(n && !state.drills.includes(n)){
      const next = [...state.drills, n];
      const { error } = await sb.from('teams').update({ drills: next }).eq('id', state.teamId);
      if(error) return toast('Couldn’t add drill. Check your connection.');
      state.drills = coachTeam.drills = next; ui.drill = n; render();
    }
    return;
  }
  if('start' in d){ state.active = { drill: ui.drill, started: Date.now(), log: [] }; saveActive(); renderDrill(); return; }
  if(d.shot){ state.active.log.push({ p: d.shot, m: +d.m }); haptic(); saveActive(); renderDrill(); bump(d.shot, +d.m); return; }
  if('undo' in d){ state.active.log.pop(); saveActive(); renderDrill(); return; }
  if('cancel' in d){ if(confirm('Discard this drill? Shots logged so far will be lost.')){ state.active = null; saveActive(); renderDrill(); } return; }
  if('end' in d){
    if(ui.busy) return;
    const c = liveCounts(), a = state.active;
    ui.busy = true; renderDrill();
    try{
      const s = await sb.from('sessions').insert({ team_id: state.teamId, drill: a.drill, started_at: new Date(a.started).toISOString() }).select('id').single();
      if(s.error) throw s.error;
      const streaks = longestStreaks(a.log);
      const rows = Object.entries(c).map(([pid,x]) => ({ session_id: s.data.id, player_id: pid, team_id: state.teamId, made: x.m, attempts: x.a, best_streak: Math.min(streaks[pid] || 0, x.m) }));
      const r = await sb.from('session_results').insert(rows);
      if(r.error){ await sb.from('sessions').delete().eq('id', s.data.id); throw r.error; }
      state.sessions.push({ id: s.data.id, drill: a.drill, kind:'team', date: a.started, counts: c });
      state.active = null; saveActive(); clearCaches();
      ui.busy = false; ui.boardDrill = a.drill; ui.period = 'all';
      const before = new Set((state.compete?.badges || []).map(b => b.player_id + b.badge));
      try{ state.compete = await loadCompete(state.teamId); }catch(_){}
      const fresh = (state.compete?.badges || []).filter(b => !before.has(b.player_id + b.badge) && BADGES[badgeKey(b.badge)]);
      render(); showTab('board');
      if(fresh.length) celebrate(fresh.slice(0, 5).map(b => ({ key: badgeKey(b.badge), kicker: `${player(b.player_id)?.name || 'A player'} earned` })));
      toast(fresh.length ? `${a.drill} saved. ${fresh.length === 1 ? `${player(fresh[0].player_id)?.name} earned ${BADGES[badgeKey(fresh[0].badge)].name}!` : `${fresh.length} new badges earned!`}` : `${a.drill} saved`);
    }catch(_){
      ui.busy = false; renderDrill();
      toast('Couldn’t save. Your shots are kept on this phone. Check your connection and try again.');
    }
    return;
  }
  if(d.bdrill){ ui.boardDrill = d.bdrill; renderBoard(); return; }
  if(d.period){ ui.period = d.period; renderBoard(); return; }
  if('share' in d){
    const { ranked } = ranking();
    const label = (ui.boardDrill === 'all' ? 'All drills' : ui.boardDrill) + ', ' + ({all:'all time','30':'last 30 days','7':'last 7 days'}[ui.period]);
    copyText(`${state.team} shooting leaderboard (${label})\n` + ranked.map((x,i) => `${i+1}. ${x.p.name} ${pct(x.m,x.a)} (${x.m}/${x.a})`).join('\n'), 'Leaderboard copied');
    return;
  }
  if(d.delsess){
    if(!confirm('Delete this drill from the records? Players will lose these shots from their stats too.')) return;
    const { error } = await sb.from('sessions').delete().eq('id', d.delsess);
    if(error) return toast('Couldn’t delete. Check your connection.');
    state.sessions = state.sessions.filter(s => s.id !== d.delsess); render(); return;
  }
  if(d.open){ ui.open = ui.open === d.open ? null : d.open; renderPlayers(); if(ui.open) loadCoachFollowers(ui.open); return; }
  if(d.rename){
    const p = player(d.rename); const n = (prompt('Player name', p.name) || '').trim().slice(0,40);
    if(n && n !== p.name){ const { error } = await sb.from('players').update({ name:n }).eq('id', p.id);
      if(error) return toast('Couldn’t rename. Check your connection.'); p.name = n; render(); }
    return;
  }
  if(d.delp){
    const p = player(d.delp);
    if(!confirm(`Remove ${p.name}? Their shooting history will be deleted too.`)) return;
    const { error } = await sb.from('players').delete().eq('id', p.id);
    if(error) return toast('Couldn’t remove. Check your connection.');
    state.players = state.players.filter(x => x.id !== p.id);
    state.sessions.forEach(s => delete s.counts[p.id]);
    if(state.active){ state.active.log = state.active.log.filter(s => s.p !== p.id); saveActive(); }
    ui.open = null; render(); return;
  }
  if(d.invite){
    const p = player(d.invite);
    copyText(`Hi ${p.name}! Follow your shooting stats for ${state.team} on Drill Board.\n1. Open ${APP_URL}\n2. Create an account\n3. Enter invite code ${p.invite_code}`, 'Invite copied');
    return;
  }
  if(d.newcode || d.unlink){
    const p = player(d.newcode || d.unlink);
    if(d.unlink && !confirm(`Unlink ${p.name}’s account? They’ll lose access until they use a new invite code.`)) return;
    for(let i = 0; i < 3; i++){
      const code = newCode();
      const patch = d.unlink ? { invite_code: code, user_id: null } : { invite_code: code };
      const { error } = await sb.from('players').update(patch).eq('id', p.id);
      if(!error){ Object.assign(p, patch); renderPlayers(); toast(d.unlink ? 'Account unlinked. New code created.' : 'New invite code created'); return; }
      if(!/duplicate|unique/i.test(error.message)) break;
    }
    toast('Couldn’t update. Check your connection.'); return;
  }
});

sb.auth.onAuthStateChange(ev => {
  if(ev === 'PASSWORD_RECOVERY'){ setTimeout(() => { ui.authTab = 'reset'; renderAuth(); show('auth'); }, 0); }
});
boot();
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }

</script>
</body>
</html>
