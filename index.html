<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drill Board</title>
<meta name="theme-color" content="#F3EEE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12241F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drill Board">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3EEE3; --bg2:#EAE3D3; --surface:#FFFDF8; --raised:#FFFFFF;
  --ink:#16241F; --muted:#66756E; --faint:rgba(22,36,31,.06); --line:rgba(22,36,31,.10);
  --brass:#9A7631; --brass-ink:#FFFDF8; --brass-soft:rgba(154,118,49,.12);
  --make:#2E7D57; --make-ink:#FFFFFF; --make-soft:rgba(46,125,87,.12); --miss:#B4532F; --miss-soft:rgba(180,83,47,.10);
  --shadow:0 1px 2px rgba(22,36,31,.06),0 8px 24px -12px rgba(22,36,31,.18);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12241F; --bg2:#0E1D19; --surface:#1A2F29; --raised:#213A33;
    --ink:#EFE7D6; --muted:#98A89F; --faint:rgba(239,231,214,.05); --line:rgba(239,231,214,.10);
    --brass:#D2AE63; --brass-ink:#12241F; --brass-soft:rgba(210,174,99,.14);
    --make:#5DBE8C; --make-ink:#0E1D19; --make-soft:rgba(93,190,140,.14); --miss:#DE7A5C; --miss-soft:rgba(222,122,92,.12);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#12241F; --bg2:#0E1D19; --surface:#1A2F29; --raised:#213A33;
  --ink:#EFE7D6; --muted:#98A89F; --faint:rgba(239,231,214,.05); --line:rgba(239,231,214,.10);
  --brass:#D2AE63; --brass-ink:#12241F; --brass-soft:rgba(210,174,99,.14);
  --make:#5DBE8C; --make-ink:#0E1D19; --make-soft:rgba(93,190,140,.14); --miss:#DE7A5C; --miss-soft:rgba(222,122,92,.12);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* header */
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin-bottom:22px}
.crest{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--brass);color:var(--brass);font:800 1.25rem/1 var(--display);letter-spacing:.02em;position:relative}
.crest::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--brass-soft)}
.app{margin:0;font-size:.8rem;color:var(--muted);font-weight:500}
.team{display:block;margin:0;padding:0;background:none;border:0;color:var(--ink);font:800 2.1rem/1 var(--display);text-align:left;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--make)}
.sync.local i{background:var(--brass)}

/* tabs */
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:22px;border:1px solid var(--line)}
nav button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.95rem;padding:10px 6px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s}
nav button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}

h2{font:700 1.6rem/1.1 var(--display);margin:26px 0 12px;letter-spacing:.005em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.lede{color:var(--muted);font-size:.95rem;margin-top:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:.9rem;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.add{background:transparent;border-style:dashed;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}

.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--brass);color:var(--brass-ink);font:800 1.35rem/1 var(--display);letter-spacing:.01em;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,opacity .2s}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:0;color:var(--muted);font-weight:500;font-size:.9rem;padding:8px 2px;cursor:pointer}
.ghost:disabled{opacity:.35;cursor:default}
.ghost.danger{color:var(--miss)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* setup card */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.panel h2{margin-top:0}

/* live drill */
.scorehead{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;margin-bottom:16px}
.scorehead .label{font-size:.85rem;color:var(--muted);margin:0 0 2px}
.scorehead .drill{font:800 2rem/1 var(--display);margin:0}
.scorehead .pct{font:800 3.4rem/.85 var(--display);color:var(--brass);text-align:right;font-variant-numeric:tabular-nums}
.scorehead .of{display:block;font:500 .8rem var(--body);color:var(--muted);text-align:right;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.pcard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcard .jersey{position:absolute;right:-4px;top:-14px;font:800 5.6rem/1 var(--display);color:var(--faint);pointer-events:none;user-select:none}
.pcard.hot{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),var(--shadow)}
.pname{position:relative;font-weight:600;font-size:1rem;line-height:1.2;display:flex;align-items:center;gap:8px;min-height:1.3em}
.tag{font-size:.7rem;font-weight:700;color:var(--brass);background:var(--brass-soft);padding:2px 7px;border-radius:999px}
.pstat{position:relative;display:flex;justify-content:space-between;align-items:baseline}
.pstat b{font:800 2.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.pstat span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.track{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--brass);transition:width .25s}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mm button{border-radius:12px;padding:14px 0;font:800 1.15rem/1 var(--display);letter-spacing:.02em;cursor:pointer;transition:transform .08s}
.mm button:active{transform:scale(.95)}
.mm .mk{background:var(--make);color:var(--make-ink);border:1px solid var(--make)}
.mm .ms{background:var(--miss-soft);color:var(--miss);border:1px solid color-mix(in srgb,var(--miss) 35%,transparent)}
.actions{margin-top:18px}
.actions .row{margin-bottom:10px}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:6px 0 18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow);min-width:0}
.step.first{border-color:var(--brass);padding-top:20px;background:linear-gradient(var(--brass-soft),var(--brass-soft)),var(--surface)}
.step .place{font:800 1rem/1 var(--display);color:var(--muted)}
.step.first .place{color:var(--brass)}
.step .nm{font-weight:600;font-size:.9rem;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .pc{font:800 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.step.first .pc{font-size:2.5rem;color:var(--brass)}
.step small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px}
.rank{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.rank li{display:grid;grid-template-columns:2rem 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .n{font:800 1.3rem var(--display);color:var(--muted);text-align:center}
.rank .who{font-weight:600;min-width:0}
.rank .who small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.rank .p{font:800 1.7rem var(--display);font-variant-numeric:tabular-nums}
.meter{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.note{color:var(--muted);font-size:.88rem;margin:12px 2px 0}
.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hist li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .t{font-weight:600}
.hist small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.hist .p{font:800 1.4rem var(--display);text-align:right;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;border-radius:8px}

/* court */
.court{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);margin:0 0 14px;touch-action:manipulation;overflow:hidden;box-shadow:var(--shadow)}
.court .wood line{stroke:rgba(110,60,20,.22);stroke-width:.6}
.court .grain line{stroke:rgba(110,60,20,.28);stroke-width:.5}
.court .keypaint{fill:#23508F}
.court .apron{fill:#23508F}
.court .zone{fill:transparent;cursor:pointer;transition:fill .15s}
.court .zone:focus{outline:none}
.court .zone:focus-visible{stroke:#FFD34D;stroke-width:2.5}
.court .zone.sel{fill:rgba(255,255,255,.26);stroke:#FFD34D;stroke-width:3}
.court.heat .zone{cursor:default}
.court .ln{fill:none;stroke:#FFFFFF;stroke-width:2;pointer-events:none}
.court .board{stroke:#FFFFFF;stroke-width:3;stroke-linecap:round}
.court .neck{stroke:#FFFFFF;stroke-width:1.5}
.court .rim{fill:none;stroke:#F26B1D;stroke-width:2.2;pointer-events:none}
.court text{fill:#2A1A0C;font-family:var(--display);pointer-events:none;paint-order:stroke;stroke:rgba(255,236,208,.75);stroke-width:3px;stroke-linejoin:round}
.court text.lt{fill:#FFFFFF;stroke:rgba(10,25,50,.45)}
.court .zn{font-family:var(--body);font-size:9.5px;font-weight:700}
.court .zv{font-size:19px;font-weight:800}
.minihead{font-size:.85rem;color:var(--muted);font-weight:500;margin:4px 0 8px}

/* players */
form.addp{display:grid;grid-template-columns:1fr 4.6rem auto;gap:8px;margin-bottom:16px}
input[type=text],input[type=number]{font:500 1rem var(--body);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
input::placeholder{color:var(--muted)}
form.addp button{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.95rem;padding:0 16px;cursor:pointer}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.plist > li{border-top:1px solid var(--line)}
.plist > li:first-child{border-top:0}
.prow{display:grid;grid-template-columns:2.6rem 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:12px 16px;cursor:pointer;font:inherit}
.num{width:2.6rem;height:2.6rem;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font:800 1.15rem var(--display);color:var(--muted)}
.prow .nm{font-weight:600}
.prow small{display:block;color:var(--muted);font-size:.8rem}
.prow b{font:800 1.5rem var(--display);font-variant-numeric:tabular-nums}
.pdetail{padding:0 16px 14px}
.pdetail table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:10px}
.pdetail td,.pdetail th{padding:7px 0;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem}
.pdetail th{color:var(--muted);font-weight:500;font-size:.8rem}
.pdetail td:nth-child(n+2),.pdetail th:nth-child(n+2){text-align:right}
.empty{color:var(--muted);padding:6px 2px 0}
.sharebox{width:100%;min-height:9rem;font:.9rem var(--body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---- accounts ---- */
[hidden]{display:none!important}
header{position:relative}
.acct{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 .85rem var(--body);cursor:pointer;box-shadow:var(--shadow)}
.team:disabled{cursor:default;opacity:1}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:240px;background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);padding:8px}
.menu .who{margin:6px 10px 10px;font-size:.85rem;color:var(--muted);word-break:break-all}
.menu .who strong{color:var(--ink);font-weight:600}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:500 .95rem var(--body);padding:11px 10px;border-radius:9px;cursor:pointer}
.menu button:hover{background:var(--faint)}
.menu .danger{color:var(--miss)}
.authcard{max-width:420px;margin:6vh auto 0}
.brandmark{text-align:center;margin-bottom:22px}
.brandmark h1{font:800 2.6rem/1 var(--display);margin:14px 0 6px}
.brandmark p{margin:0;word-break:break-all}
.crest.big{width:76px;height:76px;margin:0 auto;font-size:1.8rem}
.seg.full{display:grid;grid-template-columns:1fr 1fr;width:100%;margin-bottom:14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.field input,.panel input[type=text]{width:100%}
input[type=email],input[type=password]{font:500 1rem var(--body);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.panel input[type=text]{background:var(--bg)}
.codein::placeholder{opacity:.3}
.codein{font:800 1.8rem/1 var(--display)!important;letter-spacing:.25em;text-align:center;text-transform:uppercase;margin:6px 0 12px}
.msg{font-size:.9rem;margin:4px 0 12px;padding:10px 12px;border-radius:10px}
.msg.err{background:var(--miss-soft);color:var(--miss)}
.msg.ok{background:var(--make-soft);color:var(--make)}
.ghost.center{display:block;margin:10px auto 0}
.panel.accent{border-color:var(--brass);background:linear-gradient(var(--brass-soft),var(--brass-soft)),var(--surface)}
.loader{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.loader .crest{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.invite{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.invite small{display:block;color:var(--muted);font-size:.8rem}
.invite .code{font:800 1.7rem/1.1 var(--display);letter-spacing:.14em;color:var(--brass)}
.invbtns{display:flex;gap:6px;align-items:center}
.prow .tag{vertical-align:middle}
.hero{position:relative;overflow:hidden}
.hero .jersey{position:absolute;right:6px;top:-10px;font:800 7rem/1 var(--display);color:var(--faint);pointer-events:none}
.hero .label{font-weight:600;margin:0}
.hero .big{font:800 4.4rem/1 var(--display);color:var(--brass);margin:6px 0 8px;font-variant-numeric:tabular-nums}
.rankbox .rk{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rkn{font:800 3rem/1 var(--display);color:var(--brass)}
.rkn.dim{color:var(--muted);font-size:2.2rem}
.bars{display:block;width:100%;height:auto}
.bars .gl{stroke:var(--line);stroke-width:1}
.bars text{fill:var(--muted);font:500 9px var(--body)}
.bars rect{fill:var(--brass)}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" hidden>
    <div class="crest" id="crest" aria-hidden="true">DB</div>
    <div style="min-width:0">
      <p class="app" id="appLabel">Drill Board</p>
      <button class="team" id="teamName" aria-label="Rename team">My team</button>
    </div>
    <button class="acct" id="acct" aria-label="Account menu">DB</button>
    <div class="menu" id="menu" hidden></div>
  </header>

  <div id="loading" class="loader"><div class="crest big" aria-hidden="true">DB</div><span class="sr" style="position:absolute;left:-9999px">Loading</span></div>
  <div id="auth" hidden></div>
  <div id="onboard" hidden></div>
  <div id="error" hidden></div>

  <div id="coach" hidden>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-tab="drill">Drill</button>
      <button role="tab" aria-selected="false" data-tab="board">Leaderboard</button>
      <button role="tab" aria-selected="false" data-tab="players">Players</button>
    </nav>
    <section id="drill"></section>
    <section id="board" hidden></section>
    <section id="players" hidden></section>
  </div>

  <div id="player" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const SB_URL = 'https://ayogbykechnpeopfqoew.supabase.co';
const SB_KEY = 'sb_publishable_u1-tN9NvXyVDZRUk1urNwg_LQciq3a7';
const APP_URL = location.origin + location.pathname;
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
const MIN_ATT = 10;
const ZONES = [
  { id:'paint',  drill:'Paint' },
  { id:'mid',    drill:'Mid-range' },
  { id:'corner', drill:'Corner 3' },
  { id:'arc',    drill:'Above the break 3' },
  { id:'ft',     drill:'Free throws' },
];
const ZONE_NAMES = ZONES.map(z => z.drill);

let me = null, mode = null, coachTeam = null, myPlayers = [], pdata = null;
let state = { teamId:null, team:'', drills:[...ZONE_NAMES], players:[], sessions:[], active:null };
let ui = { drill:'Free throws', boardDrill:'all', period:'all', open:null, share:null,
           meIdx:0, meDrill:'all', mePeriod:'all', authTab:'in', menu:false, busy:false };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (m,a) => a ? Math.round(m/a*100) + '%' : '–';
const player = id => state.players.find(p => p.id === id);
const initials = n => (String(n||'').trim().split(/\s+/).map(w => w[0]).join('').slice(0,2) || 'DB').toUpperCase();
const day = t => new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const ordinal = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
let toastT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
async function copyText(text, done){
  try{ await navigator.clipboard.writeText(text); toast(done); }
  catch(_){ window.prompt('Copy this text:', text); }
}
function show(id){
  ['loading','auth','onboard','coach','player','error'].forEach(s => $('#'+s).hidden = s !== id);
  $('#hdr').hidden = !(id === 'coach' || id === 'player');
  window.scrollTo(0,0);
}
function fail(msg){
  $('#error').innerHTML = `<div class="authcard"><div class="panel"><h2>Something went wrong</h2>
    <p class="muted">${esc(msg || 'Drill Board couldn’t load. Check your internet connection and try again.')}</p>
    <button class="primary" data-retry>Try again</button>
    <button class="ghost" data-signout style="margin-top:8px">Sign out</button></div></div>`;
  show('error');
}
function niceAuthError(e){
  const m = (e && e.message) || '';
  if(/invalid login/i.test(m)) return 'That email and password don’t match.';
  if(/not confirmed/i.test(m)) return 'Please confirm your email first. Check your inbox for the link.';
  if(/already registered/i.test(m)) return 'There’s already an account with that email. Try signing in.';
  if(/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a few minutes and try again.';
  if(/password/i.test(m) && /6/.test(m)) return 'Passwords need at least 6 characters.';
  return m || 'Something went wrong. Please try again.';
}

function brand(sub){

/* ---------- boot & routing ---------- */
async function boot(){
  show('loading');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ me = null; renderAuth(); show('auth'); return; }
    me = session.user;
    await loadRoles();
    route();
  }catch(e){ fail(e && e.message && !/fetch/i.test(e.message) ? e.message : null); }
}
async function loadRoles(){
  const [t, p] = await Promise.all([
    sb.from('teams').select('id,name,drills').eq('coach_id', me.id).order('created_at').limit(1),
    sb.from('players').select('id,name,num,team_id').eq('user_id', me.id).order('created_at'),
  ]);
  if(t.error) throw t.error; if(p.error) throw p.error;
  coachTeam = t.data[0] || null; myPlayers = p.data || [];
}
function route(prefer){
  mode = prefer || (coachTeam ? 'coach' : myPlayers.length ? 'player' : null);
  ui.menu = false;
  if(!mode){ renderOnboard(); show('onboard'); return; }
  if(mode === 'coach') loadCoach(); else loadPlayer();
}

/* ---------- coach: load & persist ---------- */
function activeKey(){ return 'drillboard-active-' + state.teamId; }
function saveActive(){ try{ state.active ? localStorage.setItem(activeKey(), JSON.stringify(state.active)) : localStorage.removeItem(activeKey()); }catch(_){} }
function loadActive(){ try{ return JSON.parse(localStorage.getItem(activeKey()) || 'null'); }catch(_){ return null; } }
async function loadCoach(){
  show('loading');
  const id = coachTeam.id;
  const [p, s] = await Promise.all([
    sb.from('players').select('id,name,num,invite_code,user_id').eq('team_id', id).order('created_at'),
    sb.from('sessions').select('id,drill,started_at,session_results(player_id,made,attempts)').eq('team_id', id).order('started_at'),
  ]);
  if(p.error || s.error) return fail();
  state.teamId = id; state.team = coachTeam.name;
  state.drills = Array.isArray(coachTeam.drills) && coachTeam.drills.length ? [...coachTeam.drills] : [...ZONE_NAMES];
  const missing = ZONE_NAMES.filter(d => !state.drills.includes(d));
  if(missing.length){ state.drills.push(...missing); sb.from('teams').update({ drills: state.drills }).eq('id', id).then(()=>{}); }
  state.players = p.data;
  state.sessions = s.data.map(x => ({ id:x.id, drill:x.drill, date:Date.parse(x.started_at),
    counts:Object.fromEntries((x.session_results||[]).map(r => [r.player_id, { m:r.made, a:r.attempts }])) }));
  state.active = loadActive();
  if(!state.drills.includes(ui.drill)) ui.drill = state.drills[0];
  renderHeader(); render(); showTab('drill'); show('coach');
}

/* ---------- stats helpers ---------- */
function liveCounts(){
  const c = {};
  if(state.active) state.active.log.forEach(s => { if(!player(s.p)) return; c[s.p] = c[s.p] || {m:0,a:0}; c[s.p].a++; if(s.m) c[s.p].m++; });
  return c;
}
function totals(filterDrill, period){
  const since = period === '30' ? Date.now() - 30*864e5 : period === '7' ? Date.now() - 7*864e5 : 0;
  const t = {};
  state.sessions.forEach(s => {
    if(filterDrill !== 'all' && s.drill !== filterDrill) return;
    if(s.date < since) return;
    Object.entries(s.counts).forEach(([p,c]) => { t[p] = t[p] || {m:0,a:0}; t[p].m += c.m; t[p].a += c.a; });
  });
  return t;
}
function ranking(){
  const t = totals(ui.boardDrill, ui.period);
  const rows = state.players.map(p => ({ p, ...(t[p.id] || {m:0,a:0}) }));
  return {
    ranked: rows.filter(x => x.a >= MIN_ATT).sort((a,b) => b.m/b.a - a.m/a.a || b.a - a.a),
    low: rows.filter(x => x.a > 0 && x.a < MIN_ATT),
  };
}

  arc:    'M0,130 H38.3 A142.5,142.5 0 0 0 261.7,130 H300 V240 H0 Z',

};
// mode 'pick': tappable, highlights selected drill; mode 'heat': shaded by make rate
let courtN = 0;
function courtSVG(mode, vals, selDrill){
  const k = ++courtN;
  const z = id => ZONES.find(x => x.id === id);
  const v = id => vals[id] || {m:0,a:0};
  const style = id => {
    if(mode !== 'heat' || !v(id).a) return '';
    return ` style="fill:#E4572E;fill-opacity:${(0.10 + (v(id).m/v(id).a)*0.55).toFixed(2)}"`;
  };
  const zone = (id, key, label, extra='') => `<path class="zone${mode==='pick' && selDrill===z(id).drill ? ' sel' : ''}" d="${PATHS[key]}"${extra}${style(id)}${mode==='pick'
      ? ` data-zonepick="${esc(z(id).drill)}" role="button" tabindex="0" aria-label="${esc(label)}" aria-pressed="${selDrill===z(id).drill}"` : ''}/>`;
  const val = id => pct(v(id).m, v(id).a);
  const planks = [];
  for(let x = 0; x < 300; x += 10){
    const shade = ['#D9A56C','#D29B61','#DEAD78','#CF975D'][(x/10) % 4];
    planks.push(`<rect x="${x}" y="0" width="10" height="240" fill="${shade}"/>`);
    const j = 30 + ((x * 37) % 160);
    planks.push(`<line x1="${x}" y1="${j}" x2="${x+10}" y2="${j}" />`);
  }
  return `<svg class="court${mode==='heat' ? ' heat' : ''}" viewBox="0 0 300 240" role="group" aria-label="Half court shooting spots">
    <defs>
      <linearGradient id="sheen${k}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#5a2e0e" stop-opacity=".10"/>
      </linearGradient>
    </defs>
    <g class="wood">${planks.join('')}</g>
    <g class="grain"><line x1="0" y1="0" x2="0" y2="240"/>${Array.from({length:30},(_,i)=>`<line x1="${i*10}" y1="0" x2="${i*10}" y2="240"/>`).join('')}</g>
    <rect x="102" y="10" width="96" height="114" class="keypaint"/>
    <rect x="0" y="0" width="300" height="10" class="apron"/>
    <rect width="300" height="240" fill="url(#sheen${k})" pointer-events="none"/>
    ${zone('arc','arc','Above the break 3')}
    ${zone('corner','cornerL','Corner 3, left side')}
    ${zone('corner','cornerR','Corner 3, right side')}
    ${zone('mid','mid','Mid-range',' fill-rule="evenodd"')}
    ${zone('paint','paint','Paint')}
    ${zone('ft','ft','Free throws')}
    <g class="ln">
      <line x1="0" y1="10" x2="300" y2="10"/>
      <path d="M18,10 V94 A142.5,142.5 0 0 0 282,94 V10"/>
      <rect x="102" y="10" width="96" height="114"/>
      <path d="M114,124 A36,36 0 0 0 186,124"/>
      <path d="M114,124 A36,36 0 0 1 186,124" stroke-dasharray="5 5"/>
      <path d="M138,41.5 A12,12 0 0 0 162,41.5" />
      <line x1="102" y1="55" x2="96" y2="55"/><line x1="198" y1="55" x2="204" y2="55"/>
      <line x1="102" y1="75" x2="96" y2="75"/><line x1="198" y1="75" x2="204" y2="75"/>
      <line x1="102" y1="95" x2="96" y2="95"/><line x1="198" y1="95" x2="204" y2="95"/>
    </g>
    <line x1="132" y1="33" x2="168" y2="33" class="board"/>
    <line x1="150" y1="33" x2="150" y2="37" class="neck"/>
    <circle class="rim" cx="150" cy="41.5" r="5"/>
    <text class="zn lt" x="150" y="72" text-anchor="middle">Paint</text>
    <text class="zv lt" x="150" y="96" text-anchor="middle">${val('paint')}</text>
    <text class="zn" x="150" y="141" text-anchor="middle">Free throws</text>
    <text class="zv" x="150" y="159" text-anchor="middle" style="font-size:15px">${val('ft')}</text>
    <text class="zn" x="60" y="46" text-anchor="middle">Mid-range</text>
    <text class="zv" x="60" y="68" text-anchor="middle">${val('mid')}</text>
    <text class="zn" x="291" y="68" text-anchor="middle" transform="rotate(90 291 68)">Corner 3</text>
    <text class="zv" x="10" y="68" text-anchor="middle"${v('corner').a ? ' transform="rotate(-90 10 68)"' : ''} style="font-size:13px">${val('corner')}</text>
    <text class="zn" x="150" y="206" text-anchor="middle">Above the break 3</text>
    <text class="zv" x="150" y="228" text-anchor="middle">${val('arc')}</text>
  </svg>`;
}
function zoneVals(pid){
  const out = {};
  ZONES.forEach(z => {
    const t = totals(z.drill, 'all');
    if(pid) out[z.id] = t[pid] || {m:0,a:0};
    else out[z.id] = Object.values(t).reduce((s,x) => ({ m:s.m+x.m, a:s.a+x.a }), {m:0,a:0});
  });
  return out;
}



/* ---------- coach: drill ---------- */
function localData(){
  try{
    if(localStorage.getItem('drillboard-imported')) return null;
    const s = JSON.parse(localStorage.getItem('drillboard-v1') || 'null');
    return s && Array.isArray(s.players) && s.players.length ? s : null;
  }catch(_){ return null; }
}
function renderDrill(){
  const el = $('#drill');
  const L = (!state.players.length && !state.sessions.length) ? localData() : null;
  const importPanel = L ? `<div class="panel accent" style="margin-bottom:14px"><h2>Bring your team over</h2>
      <p class="muted">This phone has ${L.players.length} player${L.players.length>1?'s':''} and ${L.sessions.length} saved drill${L.sessions.length===1?'':'s'} from before you signed in.</p>
      <button class="primary" data-import>Import to my account</button></div>` : '';
  if(!state.players.length){
    el.innerHTML = importPanel + `<div class="panel"><h2>Build your squad</h2>
      <p class="muted">Add your players first. Each one gets an invite code so they can follow their own stats.</p>
      <button class="primary" data-go="players" style="margin-top:16px">Add players</button></div>`;
    return;
  }
  if(!state.active){
    if(!state.drills.includes(ui.drill)) ui.drill = state.drills[0];
    const others = state.drills.filter(d => !ZONE_NAMES.includes(d));
    el.innerHTML = `<div class="panel"><h2>Pick a spot</h2>
      ${courtSVG('pick', zoneVals(), ui.drill)}
      <p class="minihead">Other drills</p>

      <button class="primary" data-start>Start ${esc(ui.drill)}</button>
      <p class="lede">Court percentages are your team’s all-time rate from each spot. ${state.players.length} player${state.players.length>1?'s':''} ready.</p></div>`;
    return;
  }
  const c = liveCounts();
  const tm = Object.values(c).reduce((s,x) => s + x.m, 0), ta = Object.values(c).reduce((s,x) => s + x.a, 0);
  const best = Object.entries(c).filter(([,x]) => x.a >= 5).sort((a,b) => b[1].m/b[1].a - a[1].m/a[1].a)[0];
  const last = [...state.active.log].reverse().find(s => player(s.p));
  el.innerHTML = `<div class="scorehead">
      <div><p class="label">Live drill</p><p class="drill">${esc(state.active.drill)}</p></div>
      <div><div class="pct">${pct(tm,ta)}</div><span class="of">${tm} of ${ta} made</span></div>
    </div>
    <div class="grid">${state.players.map(p => {
      const x = c[p.id] || {m:0,a:0}, hot = best && best[0] === p.id;
      return `<div class="pcard${hot ? ' hot' : ''}">
        ${p.num ? `<span class="jersey" aria-hidden="true">${esc(p.num)}</span>` : ''}
        <div class="pname">${esc(p.name)}${hot ? '<span class="tag">Hot</span>' : ''}</div>
        <div class="pstat"><b>${pct(x.m,x.a)}</b><span>${x.m}/${x.a}</span></div>
        <div class="track"><i style="width:${x.a ? Math.round(x.m/x.a*100) : 0}%"></i></div>
        <div class="mm"><button class="mk" data-shot="${p.id}" data-m="1" aria-label="Make for ${esc(p.name)}">Make</button><button class="ms" data-shot="${p.id}" data-m="0" aria-label="Miss for ${esc(p.name)}">Miss</button></div>
      </div>`; }).join('')}</div>
    <div class="actions">
      <div class="row">
        <button class="ghost" data-undo ${last ? '' : 'disabled'}>${last ? `Undo ${esc(player(last.p).name)}’s ${last.m ? 'make' : 'miss'}` : 'Undo last shot'}</button>
        <button class="ghost danger" data-cancel>Discard</button>
      </div>
      <button class="primary" data-end ${ta && !ui.busy ? '' : 'disabled'}>${ui.busy ? 'Saving…' : 'End and save drill'}</button>
    </div>`;
}

      <div class="nm">${esc(x.p.name.trim().split(/\s+/)[0])}</div><div class="pc">${pct(x.m,x.a)}</div><small>${x.m}/${x.a}</small></div>` : '<div></div>';
  el.innerHTML = `<div class="chips">${drills.map(d => `<button class="chip" data-bdrill="${esc(d)}" aria-pressed="${d===ui.boardDrill}">${d==='all' ? 'All drills' : esc(d)}</button>`).join('')}</div>
    <div class="seg">${[['all','All time'],['30','30 days'],['7','7 days']].map(([v,l]) => `<button data-period="${v}" aria-pressed="${v===ui.period}">${l}</button>`).join('')}</div>
    ${ranked.length ? `<div class="podium">${step(top[1],1)}${step(top[0],0)}${step(top[2],2)}</div>` : ''}
    ${rest.length ? `<ol class="rank" start="4">${rest.map((x,i) => `<li><span class="n">${i+4}</span>
      <div class="who">${esc(x.p.name)}<small>${x.m}/${x.a} shots</small><div class="meter"><i style="width:${Math.round(x.m/x.a*100)}%"></i></div></div>
      <span class="p">${pct(x.m,x.a)}</span></li>`).join('')}</ol>` : ''}
    ${!ranked.length ? `<div class="panel"><p class="muted" style="margin:0">Players appear here once they’ve taken ${MIN_ATT} or more shots in this drill and time period.</p></div>` : ''}
    ${low.length ? `<p class="note">Still under ${MIN_ATT} shots: ${low.map(x => `${esc(x.p.name)} (${x.a})`).join(', ')}.</p>` : ''}
    ${ranked.length ? `<button class="primary" data-share style="margin-top:18px">Copy for the team chat</button>` : ''}
    <h2>Recent drills</h2>
    ${state.sessions.length ? `<ul class="hist">${[...state.sessions].reverse().slice(0,15).map(s => {
      const v = Object.values(s.counts), m = v.reduce((a,x)=>a+x.m,0), a = v.reduce((q,x)=>q+x.a,0);
      return `<li><div class="t">${esc(s.drill)}<small>${day(s.date)}, ${v.length} player${v.length>1?'s':''}, ${m}/${a}</small></div>
        <span class="p">${pct(m,a)}</span>
        <button class="x" data-delsess="${s.id}" aria-label="Delete ${esc(s.drill)} from ${day(s.date)}">×</button></li>`; }).join('')}</ul>`
      : '<p class="empty">Finished drills are listed here.</p>'}`;
}

/* ---------- coach: players ---------- */
function renderPlayers(){
  const el = $('#players');
  const all = totals('all','all');
  el.innerHTML = `<form class="addp" id="addForm">
      <input type="text" id="pName" placeholder="Player name" aria-label="Player name" maxlength="40" autocomplete="off" required>
      <input type="number" id="pNum" placeholder="No." aria-label="Jersey number" min="0" max="999" inputmode="numeric">
      <button type="submit">Add</button>
    </form>
    ${state.players.length ? `<ul class="plist">${state.players.map(p => {
      const x = all[p.id] || {m:0,a:0}, open = ui.open === p.id;
      return `<li><button class="prow" data-open="${p.id}" aria-expanded="${open}">
          <span class="num">${p.num ? esc(p.num) : esc(initials(p.name))}</span>
          <span><span class="nm">${esc(p.name)}</span>${p.user_id ? ' <span class="tag">Linked</span>' : ''}<small>${x.a} shot${x.a===1?'':'s'} all time</small></span>
          <b>${pct(x.m,x.a)}</b></button>
        ${open ? playerDetail(p) : ''}</li>`; }).join('')}</ul>
      <p class="note">Tap a player to see their stats and invite code.</p>`
      : '<p class="empty">Add each player with their jersey number. Each gets an invite code to see their own stats.</p>'}`;
  $('#addForm').onsubmit = async e => {
    e.preventDefault();
    const name = $('#pName').value.trim(); if(!name) return;
    const num = $('#pNum').value.trim().slice(0,3);
    const { data, error } = await sb.from('players').insert({ team_id: state.teamId, name, num }).select('id,name,num,invite_code,user_id').single();
    if(error) return toast('Couldn’t add player. Check your connection.');
    state.players.push(data); renderPlayers(); renderDrill(); renderBoard();
    $('#pName').focus();
  };
}
function playerDetail(p){
  const rows = state.drills.map(d => { const t = totals(d,'all')[p.id] || {m:0,a:0}; return t.a ? `<tr><td>${esc(d)}</td><td>${t.m}/${t.a}</td><td>${pct(t.m,t.a)}</td></tr>` : ''; }).join('');
  const recent = state.sessions.filter(s => s.counts[p.id]).slice(-5).reverse().map(s => {
    const c = s.counts[p.id]; return `<tr><td>${new Date(s.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}, ${esc(s.drill)}</td><td>${c.m}/${c.a}</td><td>${pct(c.m,c.a)}</td></tr>`; }).join('');
  const zv = zoneVals(p.id);
  const anyZone = Object.values(zv).some(x => x.a);
  return `<div class="pdetail">
    <div class="invite">${p.user_id
      ? `<div><strong>Player account linked</strong><small>${esc(p.name)} can sign in and see their own stats.</small></div><button class="ghost" data-unlink="${p.id}">Unlink</button>`
      : `<div><small>Invite code</small><span class="code">${esc(p.invite_code)}</span></div><div class="invbtns"><button class="chip" data-invite="${p.id}">Copy invite</button><button class="ghost" data-newcode="${p.id}">New code</button></div>`}
    </div>
    ${anyZone ? `<p class="minihead">Shooting by spot</p>${courtSVG('heat', zv)}` : ''}
    ${rows ? `<table><tr><th>By drill</th><th>Shots</th><th>Rate</th></tr>${rows}</table>` : '<p class="muted">No shots logged yet.</p>'}
    ${recent ? `<table><tr><th>Last 5 drills</th><th>Shots</th><th>Rate</th></tr>${recent}</table>` : ''}
    <div class="row"><button class="ghost" data-rename="${p.id}">Rename</button><button class="ghost danger" data-delp="${p.id}">Remove player</button></div>
  </div>`;
}
function render(){ renderDrill(); renderBoard(); renderPlayers(); }
function showTab(t){
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.querySelectorAll('#coach > section').forEach(s => s.hidden = s.id !== t);
  window.scrollTo(0,0);
}

/* ---------- coach: import from this phone ---------- */
async function importLocal(btn){
  const L = localData(); if(!L) return;
  btn.disabled = true; btn.textContent = 'Importing…';
  try{
    const ins = await sb.from('players').insert(L.players.map(p => ({ team_id: state.teamId, name: String(p.name).slice(0,40), num: String(p.num ?? '').slice(0,3) })))
      .select('id,name,num,invite_code,user_id');
    if(ins.error) throw ins.error;
    const idMap = {}; L.players.forEach((p,i) => idMap[p.id] = ins.data[i].id);
    const extra = (L.drills || []).filter(d => !state.drills.includes(d));
    if(extra.length){ state.drills.push(...extra); await sb.from('teams').update({ drills: state.drills }).eq('id', state.teamId); }
    const sess = (L.sessions || []).filter(s => Object.keys(s.counts || {}).some(k => idMap[k]));
    if(sess.length){
      const si = await sb.from('sessions').insert(sess.map(s => ({ team_id: state.teamId, drill: String(s.drill).slice(0,60), started_at: new Date(s.date).toISOString() }))).select('id');
      if(si.error) throw si.error;
      const rows = [];
      sess.forEach((s,i) => Object.entries(s.counts).forEach(([pid,c]) => { if(idMap[pid] && c.a) rows.push({ session_id: si.data[i].id, player_id: idMap[pid], team_id: state.teamId, made: c.m, attempts: c.a }); }));
      if(rows.length){ const r = await sb.from('session_results').insert(rows); if(r.error) throw r.error; }
    }
    try{ localStorage.setItem('drillboard-imported', '1'); }catch(_){}
    toast('Team imported'); coachTeam.drills = state.drills; loadCoach();
  }catch(e){ toast('Import didn’t finish. Check your connection and try again.'); btn.disabled = false; btn.textContent = 'Import to my account'; }
}

/* ---------- player view ---------- */
async function loadPlayer(){
  show('loading');
  const ids = myPlayers.map(p => p.id), tids = [...new Set(myPlayers.map(p => p.team_id))];
  const [t, r] = await Promise.all([
    sb.from('teams').select('id,name,drills').in('id', tids),
    sb.from('session_results').select('player_id,made,attempts,sessions(drill,started_at)').in('player_id', ids),
  ]);
  if(t.error || r.error) return fail();
  pdata = {
    teams: Object.fromEntries(t.data.map(x => [x.id, x])),
    results: r.data.filter(x => x.sessions).map(x => ({ pid:x.player_id, m:x.made, a:x.attempts, drill:x.sessions.drill, date:Date.parse(x.sessions.started_at) })).sort((a,b) => a.date - b.date),
  };
  if(ui.meIdx >= myPlayers.length) ui.meIdx = 0;
  renderHeader(); renderPlayerView(); show('player');
}
function renderPlayerView(){
  const p = myPlayers[ui.meIdx], team = pdata.teams[p.team_id] || { name:'', drills:ZONE_NAMES };
  const res = pdata.results.filter(x => x.pid === p.id);
  const m = res.reduce((s,x) => s + x.m, 0), a = res.reduce((s,x) => s + x.a, 0);
  const zv = {}; ZONES.forEach(z => { const rs = res.filter(x => x.drill === z.drill); zv[z.id] = { m: rs.reduce((s,x)=>s+x.m,0), a: rs.reduce((s,x)=>s+x.a,0) }; });
  const drills = ['all', ...new Set([...(team.drills || []), ...res.map(x => x.drill)])];
  if(!drills.includes(ui.meDrill)) ui.meDrill = 'all';
  const last = res.slice(-12);
  const bars = last.length ? `<svg viewBox="0 0 300 120" class="bars" role="img" aria-label="Make rate in your last ${last.length} drills">
      ${[0,50,100].map(v => `<line x1="24" x2="300" y1="${10 + (100-v)*0.9}" y2="${10 + (100-v)*0.9}" class="gl"/><text x="18" y="${14 + (100-v)*0.9}" text-anchor="end">${v}</text>`).join('')}
      ${last.map((x,i) => { const w = 276/12, h = x.a ? x.m/x.a*90 : 0; return `<rect x="${28 + i*w}" y="${100 - h}" width="${w-6}" height="${Math.max(h,1)}" rx="3"><title>${esc(x.drill)}, ${day(x.date)}: ${pct(x.m,x.a)}</title></rect>`; }).join('')}
    </svg>` : '<p class="empty">Your drills will show here once your coach logs some shots.</p>';
  $('#player').innerHTML = `
    ${myPlayers.length > 1 ? `<div class="chips">${myPlayers.map((q,i) => `<button class="chip" data-meidx="${i}" aria-pressed="${i===ui.meIdx}">${esc(q.name)}, ${esc(pdata.teams[q.team_id]?.name || '')}</button>`).join('')}</div>` : ''}
    <div class="hero panel">
      ${p.num ? `<span class="jersey" aria-hidden="true">${esc(p.num)}</span>` : ''}
      <p class="label">${esc(p.name)}</p>
      <div class="big">${pct(m,a)}</div>
      <p class="muted" style="margin:0">${a ? `${m} of ${a} shots made across ${res.length} drill${res.length===1?'':'s'}` : 'No shots logged yet'}</p>
    </div>
    <h2>Team rank</h2>
    <div class="chips">${drills.map(d => `<button class="chip" data-medrill="${esc(d)}" aria-pressed="${d===ui.meDrill}">${d==='all' ? 'All drills' : esc(d)}</button>`).join('')}</div>
    <div class="seg">${[['all','All time'],['30','30 days'],['7','7 days']].map(([v,l]) => `<button data-meperiod="${v}" aria-pressed="${v===ui.mePeriod}">${l}</button>`).join('')}</div>
    <div class="panel rankbox" id="rankBox"><p class="muted" style="margin:0">Loading your rank…</p></div>
    <h2>By spot</h2>
    ${courtSVG('heat', zv)}
    <h2>Recent form</h2>
    <div class="panel">${bars}</div>
    <h2>Drill history</h2>
    ${res.length ? `<ul class="hist">${[...res].reverse().slice(0,15).map(x => `<li><div class="t">${esc(x.drill)}<small>${day(x.date)}, ${x.m}/${x.a}</small></div><span class="p">${pct(x.m,x.a)}</span><span></span></li>`).join('')}</ul>` : '<p class="empty">Nothing yet.</p>'}`;
  loadRank(p);
}
async function loadRank(p){
  const box = $('#rankBox'); if(!box) return;
  const { data, error } = await sb.rpc('my_rank', { p_drill: ui.meDrill === 'all' ? null : ui.meDrill, p_days: ui.mePeriod === 'all' ? null : +ui.mePeriod });
  if(error){ box.innerHTML = '<p class="muted" style="margin:0">Couldn’t load your rank right now.</p>'; return; }
  const row = (data || []).find(x => x.player_id === p.id) || { rank:null, ranked:0, made:0, attempts:0 };
  box.innerHTML = row.rank
    ? `<div class="rk"><span class="rkn">${ordinal(row.rank)}</span><span class="muted">of ${row.ranked} ranked on the team</span></div>
       <p class="muted" style="margin:6px 0 0">${pct(row.made,row.attempts)} from ${row.made}/${row.attempts} shots. Only you can see where you rank.</p>`
    : `<div class="rk"><span class="rkn dim">Unranked</span></div>
       <p class="muted" style="margin:6px 0 0">${row.attempts ? `Take ${MIN_ATT - row.attempts} more shot${MIN_ATT - row.attempts === 1 ? '' : 's'} here to get ranked.` : `Players get ranked after ${MIN_ATT} shots.`}${row.ranked ? ` ${row.ranked} teammate${row.ranked===1?' is':'s are'} ranked.` : ''}</p>`;
}

/* ---------- events ---------- */
function pickZone(name){ ui.drill = name; renderDrill(); }
document.addEventListener('keydown', e => {
  const z = e.target.closest && e.target.closest('[data-zonepick]');
  if(z && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); pickZone(z.dataset.zonepick);
    document.querySelector(`[data-zonepick="${CSS.escape(z.dataset.zonepick)}"]`)?.focus(); }
});
document.addEventListener('click', async e => {
  if(ui.menu && !e.target.closest('#menu') && !e.target.closest('#acct')){ ui.menu = false; $('#menu').hidden = true; }
  const zp = e.target.closest('[data-zonepick]'); if(zp){ pickZone(zp.dataset.zonepick); return; }
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  // auth & account
  if(d.authtab){ ui.authTab = d.authtab; renderAuth(); return; }
  if('forgot' in d){
    const email = $('#aEmail').value.trim();
    if(!email) return renderAuth('Type your email above, then tap Forgot password again.');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
    return renderAuth(error ? niceAuthError(error) : `If there’s an account for ${email}, a reset link is on its way.`, error ? 'err' : 'ok');
  }
  if('signout' in d){ await sb.auth.signOut(); me = null; coachTeam = null; myPlayers = []; ui.authTab = 'in'; renderAuth(); show('auth'); return; }
  if(b.id === 'acct'){ ui.menu = !ui.menu; renderHeader(); return; }
  if(d.switch){ route(d.switch); return; }
  if('joinmore' in d){ ui.menu = false; renderOnboard(); show('onboard'); return; }
  if('back' in d){ route(mode); return; }
  if('retry' in d){ boot(); return; }
  if(b.id === 'teamName' && mode === 'coach'){
    const n = (prompt('Team name', state.team) || '').trim().slice(0,60);
    if(n && n !== state.team){ const { error } = await sb.from('teams').update({ name:n }).eq('id', state.teamId);
      if(error) return toast('Couldn’t rename. Check your connection.'); state.team = coachTeam.name = n; renderHeader(); }
    return;
  }
  // player view
  if(d.meidx){ ui.meIdx = +d.meidx; renderHeader(); renderPlayerView(); return; }
  if(d.medrill){ ui.meDrill = d.medrill; renderPlayerView(); return; }
  if(d.meperiod){ ui.mePeriod = d.meperiod; renderPlayerView(); return; }
  // coach
  if(d.tab){ showTab(d.tab); return; }
  if(d.go){ showTab(d.go); $('#pName')?.focus(); return; }
  if('import' in d){ importLocal(b); return; }
  if(d.pick){ ui.drill = d.pick; renderDrill(); return; }
  if('adddrill' in d){
    const n = (prompt('Drill name, e.g. Corner 3s') || '').trim().slice(0,60);
    if(n && !state.drills.includes(n)){
      const next = [...state.drills, n];
      const { error } = await sb.from('teams').update({ drills: next }).eq('id', state.teamId);
      if(error) return toast('Couldn’t add drill. Check your connection.');
      state.drills = coachTeam.drills = next; ui.drill = n; render();
    }
    return;
  }
  if('start' in d){ state.active = { drill: ui.drill, started: Date.now(), log: [] }; saveActive(); renderDrill(); return; }
  if(d.shot){ state.active.log.push({ p: d.shot, m: +d.m }); if(navigator.vibrate) try{ navigator.vibrate(10); }catch(_){} saveActive(); renderDrill(); return; }
  if('undo' in d){ state.active.log.pop(); saveActive(); renderDrill(); return; }
  if('cancel' in d){ if(confirm('Discard this drill? Shots logged so far will be lost.')){ state.active = null; saveActive(); renderDrill(); } return; }
  if('end' in d){
    if(ui.busy) return;
    const c = liveCounts(), a = state.active;
    ui.busy = true; renderDrill();
    try{
      const s = await sb.from('sessions').insert({ team_id: state.teamId, drill: a.drill, started_at: new Date(a.started).toISOString() }).select('id').single();
      if(s.error) throw s.error;
      const rows = Object.entries(c).map(([pid,x]) => ({ session_id: s.data.id, player_id: pid, team_id: state.teamId, made: x.m, attempts: x.a }));
      const r = await sb.from('session_results').insert(rows);
      if(r.error){ await sb.from('sessions').delete().eq('id', s.data.id); throw r.error; }
      state.sessions.push({ id: s.data.id, drill: a.drill, date: a.started, counts: c });
      state.active = null; saveActive();
      ui.busy = false; ui.boardDrill = a.drill; ui.period = 'all';
      render(); showTab('board'); toast(`${a.drill} saved`);
    }catch(_){
      ui.busy = false; renderDrill();
      toast('Couldn’t save. Your shots are kept on this phone. Check your connection and try again.');
    }
    return;
  }
  if(d.bdrill){ ui.boardDrill = d.bdrill; renderBoard(); return; }
  if(d.period){ ui.period = d.period; renderBoard(); return; }
  if('share' in d){
    const { ranked } = ranking();
    const label = (ui.boardDrill === 'all' ? 'All drills' : ui.boardDrill) + ', ' + ({all:'all time','30':'last 30 days','7':'last 7 days'}[ui.period]);
    copyText(`${state.team} shooting leaderboard (${label})\n` + ranked.map((x,i) => `${i+1}. ${x.p.name} ${pct(x.m,x.a)} (${x.m}/${x.a})`).join('\n'), 'Leaderboard copied');
    return;
  }
  if(d.delsess){
    if(!confirm('Delete this drill from the records? Players will lose these shots from their stats too.')) return;
    const { error } = await sb.from('sessions').delete().eq('id', d.delsess);
    if(error) return toast('Couldn’t delete. Check your connection.');
    state.sessions = state.sessions.filter(s => s.id !== d.delsess); render(); return;
  }
  if(d.open){ ui.open = ui.open === d.open ? null : d.open; renderPlayers(); return; }
  if(d.rename){
    const p = player(d.rename); const n = (prompt('Player name', p.name) || '').trim().slice(0,40);
    if(n && n !== p.name){ const { error } = await sb.from('players').update({ name:n }).eq('id', p.id);
      if(error) return toast('Couldn’t rename. Check your connection.'); p.name = n; render(); }
    return;
  }
  if(d.delp){
    const p = player(d.delp);
    if(!confirm(`Remove ${p.name}? Their shooting history will be deleted too.`)) return;
    const { error } = await sb.from('players').delete().eq('id', p.id);
    if(error) return toast('Couldn’t remove. Check your connection.');
    state.players = state.players.filter(x => x.id !== p.id);
    state.sessions.forEach(s => delete s.counts[p.id]);
    if(state.active){ state.active.log = state.active.log.filter(s => s.p !== p.id); saveActive(); }
    ui.open = null; render(); return;
  }
  if(d.invite){
    const p = player(d.invite);
    copyText(`Hi ${p.name}! Follow your shooting stats for ${state.team} on Drill Board.\n1. Open ${APP_URL}\n2. Create an account\n3. Enter invite code ${p.invite_code}`, 'Invite copied');
    return;
  }
  if(d.newcode || d.unlink){
    const p = player(d.newcode || d.unlink);
    if(d.unlink && !confirm(`Unlink ${p.name}’s account? They’ll lose access until they use a new invite code.`)) return;
    for(let i = 0; i < 3; i++){
      const code = newCode();
      const patch = d.unlink ? { invite_code: code, user_id: null } : { invite_code: code };
      const { error } = await sb.from('players').update(patch).eq('id', p.id);
      if(!error){ Object.assign(p, patch); renderPlayers(); toast(d.unlink ? 'Account unlinked. New code created.' : 'New invite code created'); return; }
      if(!/duplicate|unique/i.test(error.message)) break;
    }
    toast('Couldn’t update. Check your connection.'); return;
  }
});

sb.auth.onAuthStateChange(ev => {
  if(ev === 'PASSWORD_RECOVERY'){ setTimeout(() => { ui.authTab = 'reset'; renderAuth(); show('auth'); }, 0); }
});
boot();
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }

</script>
