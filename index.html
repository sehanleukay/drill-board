<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drill Board</title>
<meta name="theme-color" content="#F3EEE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12241F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drill Board">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE3; --bg2:#EAE3D3; --surface:#FFFDF8; --raised:#FFFFFF;
  --ink:#16241F; --muted:#66756E; --faint:rgba(22,36,31,.06); --line:rgba(22,36,31,.10);
  --brass:#9A7631; --brass-ink:#FFFDF8; --brass-soft:rgba(154,118,49,.12);
  --make:#2E7D57; --make-ink:#FFFFFF; --make-soft:rgba(46,125,87,.12); --miss:#B4532F; --miss-soft:rgba(180,83,47,.10);
  --shadow:0 1px 2px rgba(22,36,31,.06),0 8px 24px -12px rgba(22,36,31,.18);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12241F; --bg2:#0E1D19; --surface:#1A2F29; --raised:#213A33;
    --ink:#EFE7D6; --muted:#98A89F; --faint:rgba(239,231,214,.05); --line:rgba(239,231,214,.10);
    --brass:#D2AE63; --brass-ink:#12241F; --brass-soft:rgba(210,174,99,.14);
    --make:#5DBE8C; --make-ink:#0E1D19; --make-soft:rgba(93,190,140,.14); --miss:#DE7A5C; --miss-soft:rgba(222,122,92,.12);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#12241F; --bg2:#0E1D19; --surface:#1A2F29; --raised:#213A33;
  --ink:#EFE7D6; --muted:#98A89F; --faint:rgba(239,231,214,.05); --line:rgba(239,231,214,.10);
  --brass:#D2AE63; --brass-ink:#12241F; --brass-soft:rgba(210,174,99,.14);
  --make:#5DBE8C; --make-ink:#0E1D19; --make-soft:rgba(93,190,140,.14); --miss:#DE7A5C; --miss-soft:rgba(222,122,92,.12);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* header */
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin-bottom:22px}
.crest{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--brass);color:var(--brass);font:800 1.25rem/1 var(--display);letter-spacing:.02em;position:relative}
.crest::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--brass-soft)}
.app{margin:0;font-size:.8rem;color:var(--muted);font-weight:500}
.team{display:block;margin:0;padding:0;background:none;border:0;color:var(--ink);font:800 2.1rem/1 var(--display);text-align:left;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--make)}
.sync.local i{background:var(--brass)}

/* tabs */
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:22px;border:1px solid var(--line)}
nav button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.95rem;padding:10px 6px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s}
nav button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}

h2{font:700 1.6rem/1.1 var(--display);margin:26px 0 12px;letter-spacing:.005em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.lede{color:var(--muted);font-size:.95rem;margin-top:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:.9rem;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.add{background:transparent;border-style:dashed;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}

.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--brass);color:var(--brass-ink);font:800 1.35rem/1 var(--display);letter-spacing:.01em;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,opacity .2s}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:0;color:var(--muted);font-weight:500;font-size:.9rem;padding:8px 2px;cursor:pointer}
.ghost:disabled{opacity:.35;cursor:default}
.ghost.danger{color:var(--miss)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* setup card */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.panel h2{margin-top:0}

/* live drill */
.scorehead{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;margin-bottom:16px}
.scorehead .label{font-size:.85rem;color:var(--muted);margin:0 0 2px}
.scorehead .drill{font:800 2rem/1 var(--display);margin:0}
.scorehead .pct{font:800 3.4rem/.85 var(--display);color:var(--brass);text-align:right;font-variant-numeric:tabular-nums}
.scorehead .of{display:block;font:500 .8rem var(--body);color:var(--muted);text-align:right;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.pcard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcard .jersey{position:absolute;right:-4px;top:-14px;font:800 5.6rem/1 var(--display);color:var(--faint);pointer-events:none;user-select:none}
.pcard.hot{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),var(--shadow)}
.pname{position:relative;font-weight:600;font-size:1rem;line-height:1.2;display:flex;align-items:center;gap:8px;min-height:1.3em}
.tag{font-size:.7rem;font-weight:700;color:var(--brass);background:var(--brass-soft);padding:2px 7px;border-radius:999px}
.pstat{position:relative;display:flex;justify-content:space-between;align-items:baseline}
.pstat b{font:800 2.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.pstat span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.track{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--brass);transition:width .25s}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mm button{border-radius:12px;padding:14px 0;font:800 1.15rem/1 var(--display);letter-spacing:.02em;cursor:pointer;transition:transform .08s}
.mm button:active{transform:scale(.95)}
.mm .mk{background:var(--make);color:var(--make-ink);border:1px solid var(--make)}
.mm .ms{background:var(--miss-soft);color:var(--miss);border:1px solid color-mix(in srgb,var(--miss) 35%,transparent)}
.actions{margin-top:18px}
.actions .row{margin-bottom:10px}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:6px 0 18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow);min-width:0}
.step.first{border-color:var(--brass);padding-top:20px;background:linear-gradient(var(--brass-soft),var(--brass-soft)),var(--surface)}
.step .place{font:800 1rem/1 var(--display);color:var(--muted)}
.step.first .place{color:var(--brass)}
.step .nm{font-weight:600;font-size:.9rem;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .pc{font:800 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.step.first .pc{font-size:2.5rem;color:var(--brass)}
.step small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px}
.rank{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.rank li{display:grid;grid-template-columns:2rem 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .n{font:800 1.3rem var(--display);color:var(--muted);text-align:center}
.rank .who{font-weight:600;min-width:0}
.rank .who small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.rank .p{font:800 1.7rem var(--display);font-variant-numeric:tabular-nums}
.meter{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.note{color:var(--muted);font-size:.88rem;margin:12px 2px 0}
.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hist li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .t{font-weight:600}
.hist small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.hist .p{font:800 1.4rem var(--display);text-align:right;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;border-radius:8px}

/* players */
form.addp{display:grid;grid-template-columns:1fr 4.6rem auto;gap:8px;margin-bottom:16px}
input[type=text],input[type=number]{font:500 1rem var(--body);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
input::placeholder{color:var(--muted)}
form.addp button{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.95rem;padding:0 16px;cursor:pointer}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.plist > li{border-top:1px solid var(--line)}
.plist > li:first-child{border-top:0}
.prow{display:grid;grid-template-columns:2.6rem 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:12px 16px;cursor:pointer;font:inherit}
.num{width:2.6rem;height:2.6rem;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font:800 1.15rem var(--display);color:var(--muted)}
.prow .nm{font-weight:600}
.prow small{display:block;color:var(--muted);font-size:.8rem}
.prow b{font:800 1.5rem var(--display);font-variant-numeric:tabular-nums}
.pdetail{padding:0 16px 14px}
.pdetail table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:10px}
.pdetail td,.pdetail th{padding:7px 0;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem}
.pdetail th{color:var(--muted);font-weight:500;font-size:.8rem}
.pdetail td:nth-child(n+2),.pdetail th:nth-child(n+2){text-align:right}
.empty{color:var(--muted);padding:6px 2px 0}
.sharebox{width:100%;min-height:9rem;font:.9rem var(--body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crest" id="crest" aria-hidden="true">MT</div>
    <div style="min-width:0">
      <p class="app">Drill Board</p>
      <button class="team" id="teamName" aria-label="Rename team">My team</button>
    </div>
    <div class="sync local" id="sync"><i></i><span>On this device</span></div>
  </header>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="drill">Drill</button>
    <button role="tab" aria-selected="false" data-tab="board">Leaderboard</button>
    <button role="tab" aria-selected="false" data-tab="players">Players</button>
  </nav>
  <section id="drill"></section>
  <section id="board" hidden></section>
  <section id="players" hidden></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const LS_KEY = 'drillboard-v1';
const MIN_ATT = 10;
const DEFAULT = { team:'My team', players:[], drills:['Free throws','Spot-up 3s','Mid-range','Layups'], active:null, sessions:[] };
let state = JSON.parse(JSON.stringify(DEFAULT));
let ui = { drill:'Free throws', boardDrill:'all', period:'all', open:null, share:null };
let ref = null;

/* ---------- storage ---------- */
function valid(s){ return s && typeof s === 'object' && Array.isArray(s.players) && Array.isArray(s.sessions); }
function loadLocal(){ try{ const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return valid(s) ? s : null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
let dirty=false, writing=false, timer=null;
function persist(){ saveLocal(); if(!ref) return; dirty=true; setSync('Saving', true); clearTimeout(timer); timer=setTimeout(flush,500); }
async function flush(){
  if(writing || !dirty) return;
  writing = true; dirty = false;
  try{ await ref.set(JSON.parse(JSON.stringify(state))); setSync('Synced', false); }
  catch(e){ setSync('On this device', true); }
  writing = false; if(dirty) flush();
}
function setSync(t, local){ const el = document.getElementById('sync'); el.querySelector('span').textContent = t; el.classList.toggle('local', !!local); }
async function connect(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    ref = db.doc('data/users/' + uid + '/team');
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if(valid(remote)){ state = JSON.parse(JSON.stringify(remote)); saveLocal(); render(); setSync('Synced', false); }
    else if(state.players.length || state.sessions.length) persist();
    else setSync('Synced', false);
  }catch(e){ ref = null; }
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (m,a) => a ? Math.round(m/a*100) + '%' : '–';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const player = id => state.players.find(p => p.id === id);
const initials = n => (n.trim().split(/\s+/).map(w => w[0]).join('').slice(0,2) || 'DB').toUpperCase();
const day = t => new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
function liveCounts(){
  const c = {};
  if(state.active) state.active.log.forEach(s => { c[s.p] = c[s.p] || {m:0,a:0}; c[s.p].a++; if(s.m) c[s.p].m++; });
  return c;
}
function totals(filterDrill, period){
  const since = period === '30' ? Date.now() - 30*864e5 : period === '7' ? Date.now() - 7*864e5 : 0;
  const t = {};
  state.sessions.forEach(s => {
    if(filterDrill !== 'all' && s.drill !== filterDrill) return;
    if(s.date < since) return;
    Object.entries(s.counts).forEach(([p,c]) => { t[p] = t[p] || {m:0,a:0}; t[p].m += c.m; t[p].a += c.a; });
  });
  return t;
}
function ranking(){
  const t = totals(ui.boardDrill, ui.period);
  const rows = state.players.map(p => ({ p, ...(t[p.id] || {m:0,a:0}) }));
  return {
    ranked: rows.filter(x => x.a >= MIN_ATT).sort((a,b) => b.m/b.a - a.m/a.a || b.a - a.a),
    low: rows.filter(x => x.a > 0 && x.a < MIN_ATT),
  };
}
let toastT;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }

/* ---------- render: drill ---------- */
function renderDrill(){
  const el = document.getElementById('drill');
  if(!state.players.length){
    el.innerHTML = `<div class="panel"><h2>Build your squad</h2>
      <p class="muted">Add your players first. Then pick a drill here and log every shot as they take it.</p>
      <button class="primary" data-go="players" style="margin-top:16px">Add players</button></div>`;
    return;
  }
  if(!state.active){
    if(!state.drills.includes(ui.drill)) ui.drill = state.drills[0];
    el.innerHTML = `<div class="panel"><h2>Choose a drill</h2>
      <div class="chips">${state.drills.map(d => `<button class="chip" data-pick="${esc(d)}" aria-pressed="${d===ui.drill}">${esc(d)}</button>`).join('')}
      <button class="chip add" data-adddrill>Add drill</button></div>
      <button class="primary" data-start>Start ${esc(ui.drill)}</button>
      <p class="lede">${state.players.length} player${state.players.length>1?'s':''} ready. Each gets a card with Make and Miss.</p></div>`;
    return;
  }
  const c = liveCounts();
  const tm = Object.values(c).reduce((s,x) => s + x.m, 0), ta = Object.values(c).reduce((s,x) => s + x.a, 0);
  const best = Object.entries(c).filter(([,x]) => x.a >= 5).sort((a,b) => b[1].m/b[1].a - a[1].m/a[1].a)[0];
  const last = state.active.log.at(-1);
  el.innerHTML = `<div class="scorehead">
      <div><p class="label">Live drill</p><p class="drill">${esc(state.active.drill)}</p></div>
      <div><div class="pct">${pct(tm,ta)}</div><span class="of">${tm} of ${ta} made</span></div>
    </div>
    <div class="grid">${state.players.map(p => {
      const x = c[p.id] || {m:0,a:0}, hot = best && best[0] === p.id;
      return `<div class="pcard${hot ? ' hot' : ''}">
        ${p.num !== '' ? `<span class="jersey" aria-hidden="true">${esc(p.num)}</span>` : ''}
        <div class="pname">${esc(p.name)}${hot ? '<span class="tag">Hot</span>' : ''}</div>
        <div class="pstat"><b>${pct(x.m,x.a)}</b><span>${x.m}/${x.a}</span></div>
        <div class="track"><i style="width:${x.a ? Math.round(x.m/x.a*100) : 0}%"></i></div>
        <div class="mm"><button class="mk" data-shot="${p.id}" data-m="1" aria-label="Make for ${esc(p.name)}">Make</button><button class="ms" data-shot="${p.id}" data-m="0" aria-label="Miss for ${esc(p.name)}">Miss</button></div>
      </div>`; }).join('')}</div>
    <div class="actions">
      <div class="row">
        <button class="ghost" data-undo ${last ? '' : 'disabled'}>${last ? `Undo ${esc(player(last.p)?.name || 'last')}’s ${last.m ? 'make' : 'miss'}` : 'Undo last shot'}</button>
        <button class="ghost danger" data-cancel>Discard</button>
      </div>
      <button class="primary" data-end ${ta ? '' : 'disabled'}>End and save drill</button>
    </div>`;
}

/* ---------- render: leaderboard ---------- */
function renderBoard(){
  const el = document.getElementById('board');
  const { ranked, low } = ranking();
  const drills = ['all', ...state.drills];
  const top = ranked.slice(0,3), rest = ranked.slice(3);
  const step = (x, i) => x ? `<div class="step${i===0?' first':''}"><div class="place">${['1st','2nd','3rd'][i]}</div>
      <div class="nm">${esc(x.p.name.trim().split(/\s+/)[0])}</div><div class="pc">${pct(x.m,x.a)}</div><small>${x.m}/${x.a}</small></div>` : '<div></div>';
  el.innerHTML = `<div class="chips">${drills.map(d => `<button class="chip" data-bdrill="${esc(d)}" aria-pressed="${d===ui.boardDrill}">${d==='all' ? 'All drills' : esc(d)}</button>`).join('')}</div>
    <div class="seg">${[['all','All time'],['30','30 days'],['7','7 days']].map(([v,l]) => `<button data-period="${v}" aria-pressed="${v===ui.period}">${l}</button>`).join('')}</div>
    ${ranked.length ? `<div class="podium">${step(top[1],1)}${step(top[0],0)}${step(top[2],2)}</div>` : ''}
    ${rest.length ? `<ol class="rank" start="4">${rest.map((x,i) => `<li><span class="n">${i+4}</span>
      <div class="who">${esc(x.p.name)}<small>${x.m}/${x.a} shots</small><div class="meter"><i style="width:${Math.round(x.m/x.a*100)}%"></i></div></div>
      <span class="p">${pct(x.m,x.a)}</span></li>`).join('')}</ol>` : ''}
    ${!ranked.length ? `<div class="panel"><p class="muted" style="margin:0">Players appear here once they’ve taken ${MIN_ATT} or more shots in this drill and time period.</p></div>` : ''}
    ${low.length ? `<p class="note">Still under ${MIN_ATT} shots: ${low.map(x => `${esc(x.p.name)} (${x.a})`).join(', ')}.</p>` : ''}
    ${ranked.length ? `<button class="primary" data-share style="margin-top:18px">Copy for the team chat</button>` : ''}
    ${ui.share ? `<textarea class="sharebox" readonly id="shareText">${esc(ui.share)}</textarea>` : ''}
    <h2>Recent drills</h2>
    ${state.sessions.length ? `<ul class="hist">${[...state.sessions].reverse().slice(0,15).map(s => {
      const v = Object.values(s.counts), m = v.reduce((a,x)=>a+x.m,0), a = v.reduce((q,x)=>q+x.a,0);
      return `<li><div class="t">${esc(s.drill)}<small>${day(s.date)}, ${v.length} player${v.length>1?'s':''}, ${m}/${a}</small></div>
        <span class="p">${pct(m,a)}</span>
        <button class="x" data-delsess="${s.id}" aria-label="Delete ${esc(s.drill)} from ${day(s.date)}">×</button></li>`; }).join('')}</ul>`
      : '<p class="empty">Finished drills are listed here.</p>'}`;
}

/* ---------- render: players ---------- */
function renderPlayers(){
  const el = document.getElementById('players');
  const all = totals('all','all');
  el.innerHTML = `<form class="addp" id="addForm">
      <input type="text" id="pName" placeholder="Player name" aria-label="Player name" maxlength="40" autocomplete="off" required>
      <input type="number" id="pNum" placeholder="No." aria-label="Jersey number" min="0" max="99" inputmode="numeric">
      <button type="submit">Add</button>
    </form>
    ${state.players.length ? `<ul class="plist">${state.players.map(p => {
      const x = all[p.id] || {m:0,a:0}, open = ui.open === p.id;
      return `<li><button class="prow" data-open="${p.id}" aria-expanded="${open}">
          <span class="num">${p.num !== '' ? esc(p.num) : esc(initials(p.name))}</span>
          <span><span class="nm">${esc(p.name)}</span><small>${x.a} shot${x.a===1?'':'s'} all time</small></span>
          <b>${pct(x.m,x.a)}</b></button>
        ${open ? playerDetail(p) : ''}</li>`; }).join('')}</ul>`
      : '<p class="empty">Add each player with their jersey number. It shows on their drill card.</p>'}`;
  document.getElementById('addForm').onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById('pName').value.trim(); if(!name) return;
    state.players.push({ id: uid(), name, num: document.getElementById('pNum').value.trim() });
    persist(); renderPlayers(); renderDrill(); renderBoard();
    document.getElementById('pName').focus();
  };
}
function playerDetail(p){
  const rows = state.drills.map(d => { const t = totals(d,'all')[p.id] || {m:0,a:0}; return t.a ? `<tr><td>${esc(d)}</td><td>${t.m}/${t.a}</td><td>${pct(t.m,t.a)}</td></tr>` : ''; }).join('');
  const recent = state.sessions.filter(s => s.counts[p.id]).slice(-5).reverse().map(s => {
    const c = s.counts[p.id]; return `<tr><td>${new Date(s.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}, ${esc(s.drill)}</td><td>${c.m}/${c.a}</td><td>${pct(c.m,c.a)}</td></tr>`; }).join('');
  return `<div class="pdetail">
    ${rows ? `<table><tr><th>By drill</th><th>Shots</th><th>Rate</th></tr>${rows}</table>` : '<p class="muted">No shots logged yet.</p>'}
    ${recent ? `<table><tr><th>Last 5 drills</th><th>Shots</th><th>Rate</th></tr>${recent}</table>` : ''}
    <div class="row"><button class="ghost" data-rename="${p.id}">Rename</button><button class="ghost danger" data-delp="${p.id}">Remove player</button></div>
  </div>`;
}
function render(){
  document.getElementById('teamName').textContent = state.team;
  document.getElementById('crest').textContent = initials(state.team);
  renderDrill(); renderBoard(); renderPlayers();
}

/* ---------- actions ---------- */
function showTab(t){
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.querySelectorAll('.wrap > section').forEach(s => s.hidden = s.id !== t);
  window.scrollTo(0,0);
}
function buildShare(){
  const { ranked } = ranking();
  const label = (ui.boardDrill === 'all' ? 'All drills' : ui.boardDrill) + ', ' + ({all:'all time','30':'last 30 days','7':'last 7 days'}[ui.period]);
  return `${state.team} shooting leaderboard (${label})\n` + ranked.map((x,i) => `${i+1}. ${x.p.name} ${pct(x.m,x.a)} (${x.m}/${x.a})`).join('\n');
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.tab){ showTab(d.tab); return; }
  if(d.go){ showTab(d.go); document.getElementById('pName')?.focus(); return; }
  if(d.pick){ ui.drill = d.pick; renderDrill(); return; }
  if('adddrill' in d){ const n = (prompt('Drill name, e.g. Corner 3s') || '').trim(); if(n && !state.drills.includes(n)){ state.drills.push(n); ui.drill = n; persist(); render(); } return; }
  if('start' in d){ state.active = { drill: ui.drill, started: Date.now(), log: [] }; persist(); renderDrill(); return; }
  if(d.shot){ state.active.log.push({ p: d.shot, m: +d.m }); if(navigator.vibrate) try{ navigator.vibrate(10); }catch(_){} persist(); renderDrill(); return; }
  if('undo' in d){ state.active.log.pop(); persist(); renderDrill(); return; }
  if('cancel' in d){ if(confirm('Discard this drill? Shots logged so far will be lost.')){ state.active = null; persist(); renderDrill(); } return; }
  if('end' in d){
    const c = liveCounts(); const a = state.active;
    state.sessions.push({ id: uid(), drill: a.drill, date: a.started, counts: c });
    state.active = null; ui.boardDrill = a.drill; ui.period = 'all'; ui.share = null;
    persist(); render(); showTab('board'); toast(`${a.drill} saved`); return;
  }
  if(d.bdrill){ ui.boardDrill = d.bdrill; ui.share = null; renderBoard(); return; }
  if(d.period){ ui.period = d.period; ui.share = null; renderBoard(); return; }
  if('share' in d){
    const text = buildShare();
    try{ await navigator.clipboard.writeText(text); ui.share = null; renderBoard(); toast('Leaderboard copied'); }
    catch(_){ ui.share = text; renderBoard(); const ta = document.getElementById('shareText'); ta.focus(); ta.select(); toast('Select and copy the text below'); }
    return;
  }
  if(d.delsess){ if(confirm('Delete this drill from the records?')){ state.sessions = state.sessions.filter(s => s.id !== d.delsess); persist(); render(); } return; }
  if(d.open){ ui.open = ui.open === d.open ? null : d.open; renderPlayers(); return; }
  if(d.rename){ const p = player(d.rename); const n = (prompt('Player name', p.name) || '').trim(); if(n){ p.name = n; persist(); render(); } return; }
  if(d.delp){ const p = player(d.delp); if(confirm(`Remove ${p.name}? Their past shots stay in saved drill totals.`)){ state.players = state.players.filter(x => x.id !== p.id); if(state.active) state.active.log = state.active.log.filter(s => s.p !== p.id); ui.open = null; persist(); render(); } return; }
});
document.getElementById('teamName').onclick = () => {
  const n = (prompt('Team name', state.team) || '').trim();
  if(n){ state.team = n; persist(); render(); }
};

const local = loadLocal();
if(local) state = local;
render();
connect();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
